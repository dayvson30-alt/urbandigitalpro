<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1640px;height:624px;overflow:hidden}
body{background:#0F2A2E;font-family:Figtree,sans-serif;color:#fff;position:relative}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,#0B7A63 0%,rgba(11,122,99,0) 65%);right:-260px;top:-300px;opacity:.9}
.glow2{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,#0B7A63 0%,rgba(11,122,99,0) 65%);left:-300px;bottom:-420px;opacity:.6}
.bigU{position:absolute;right:30px;top:90px;width:420px;height:420px;opacity:.10}
.wrap{position:absolute;left:300px;top:50%;transform:translateY(-55%);width:760px;text-align:left;z-index:2}
.photo{position:absolute;right:0;top:0;width:900px;height:624px;background:url(../social/photos/phone-porch.jpg) 18% 30%/cover no-repeat}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0F2A2E 0%,rgba(15,42,46,.85) 22%,rgba(15,42,46,0) 55%)}
.brand{display:inline-flex;align-items:center;gap:18px;font-weight:700;font-size:30px;letter-spacing:1px;color:#D3ECE4;margin-bottom:26px}
.brand svg{width:54px;height:54px}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:62px;line-height:1.02;letter-spacing:-1.5px}
h1 span{color:#FFE27A}
.chip{display:inline-flex;align-items:center;gap:14px;margin-top:30px;font-size:24px!important;background:#fff;color:#0F2A2E;border-radius:999px;padding:14px 30px 14px 16px;font-weight:700;font-size:28px}
.chip svg{width:46px;height:46px}
.chip b{color:#0B7A63}
</style></head><body>
<div class="glow"></div><div class="glow2"></div>
<div class="photo"></div><svg style="display:none" class="bigU" viewBox="0 0 100 100"><path d="M30 20 v36 a20 20 0 0 0 40 0 v-36" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/></svg>
<div class="wrap">
  <div class="brand"><svg viewBox="0 0 100 100"><rect width="100" height="100" rx="50" fill="#0B7A63"/><path d="M30 30 v26 a14 14 0 0 0 28 0 v-26" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/><circle cx="73" cy="29" r="6.5" fill="#FFE27A"/></svg>URBAN DIGITAL PRODUCTS</div>
  <h1>Ferramentas digitais para<br><span>empresários brasileiros<br>nos EUA</span></h1>
  <div class="chip"><svg viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#0F2A2E"/><path d="M18 24 h64 a7 7 0 0 1 7 7 v34 a7 7 0 0 1 -7 7 H44 L28 84 v-12 h-10 a7 7 0 0 1 -7 -7 V31 a7 7 0 0 1 7 -7z" fill="#0B7A63"/><path d="M33 48 l10 10 l23 -23" fill="none" stroke="#FFE27A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>QuoteZap: orçamento em inglês em 30s</div>
</div>
</body></html>
